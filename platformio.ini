; PlatformIO Project Configuration for ESP8266 Gold Price Display
[env:d1_mini]
platform = espressif8266@^4.2
board = d1_mini
framework = arduino

monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

; Libraries
lib_deps =
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.4
    wayoda/LedControl@^1.0.6

; Build options
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DDEBUG_ESP_HTTP_CLIENT
